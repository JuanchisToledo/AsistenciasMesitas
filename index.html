function weekStart(ms) { var d = new Date(ms); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function monthKey(ms) { var d = new Date(ms); return d.getFullYear() * 12 + d.getMonth(); }
function computeStats(shifts, st) {
  var per = {}, out = {};
  shifts.forEach(function (s) {
    if (!s.outAt || !s.inAt) return;
    var end = s.outAt, cap = st.maxShiftHours * 3600000;
    if (end - s.inAt > cap) end = s.inAt + cap;
    if (end - s.inAt < st.minMinutes * 60000) return;
    var p = per[s.uid] = per[s.uid] || { name: s.name, iv: [] };
    p.iv.push([s.inAt, end]);
  });
  Object.keys(per).forEach(function (uid) {
    var iv = per[uid].iv.sort(function (a, b) { return a[0] - b[0]; }), merged = [];
    iv.forEach(function (i) {
      var last = merged[merged.length - 1];
      if (last && i[0] <= last[1]) last[1] = Math.max(last[1], i[1]); else merged.push([i[0], i[1]]);
    });
    var r = { name: per[uid].name, minM: {}, ptsM: {}, weekMin: {}, total: 0, totalMin: 0, streak: 0 };
    merged.forEach(function (i) {
      var min = (i[1] - i[0]) / 60000, pts = Math.floor(min / 15) * 15 / 60 * st.pointsPerHour, mk = monthKey(i[0]), wk = weekStart(i[0]);
      r.minM[mk] = (r.minM[mk] || 0) + min; r.ptsM[mk] = (r.ptsM[mk] || 0) + pts;
      r.total += pts; r.totalMin += min; r.weekMin[wk] = (r.weekMin[wk] || 0) + min;
    });
    var wks = Object.keys(r.weekMin).map(Number).sort(function (a, b) { return a - b; }), lastOk = null, streak = 0;
    wks.forEach(function (wk) {
      if (r.weekMin[wk] < st.weeklyGoalHours * 60) return;
      streak = (lastOk !== null && Math.round((wk - lastOk) / 604800000) === 1) ? streak + 1 : 1;
      var bonus = st.weeklyBonus + st.streakBonus * Math.min(streak - 1, 4), mk = monthKey(wk);
      r.ptsM[mk] = (r.ptsM[mk] || 0) + bonus; r.total += bonus; lastOk = wk;
    });
    var now = weekStart(Date.now());
    r.streak = (lastOk !== null && Math.round((now - lastOk) / 604800000) <= 1) ? streak : 0;
    out[uid] = r;
  });
  return out;
}

  function openScanner() {

      loadJsQR(function (ok) { if (ok) openScanner(); else showToast("No se pudo cargar el lector de QR (conexión o bloqueador de anuncios). Escaneá con la cámara normal del celular o escribí el código."); });
